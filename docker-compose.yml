services:
  postgres:
    image: postgres:16-alpine
    container_name: linkpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: linkpilot
      POSTGRES_PASSWORD: linkpilot_password
      POSTGRES_DB: linkpilot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data:
    driver: local

